<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">ZQ research portfolio architecture</title>
  <desc id="desc">Typed evidence content feeds server-rendered routes, metadata, and validation, then a locked build is checked by Playwright and deployed to Vercel.</desc>
  <rect width="1200" height="650" fill="#f2f0e8"/>
  <path d="M0 40H1200M0 80H1200M0 120H1200M0 160H1200M0 200H1200M0 240H1200M0 280H1200M0 320H1200M0 360H1200M0 400H1200M0 440H1200M0 480H1200M0 520H1200M0 560H1200M0 600H1200" stroke="#111820" stroke-opacity=".07"/>
  <text x="70" y="75" fill="#111820" font-family="Georgia,serif" font-size="38">Evidence → static routes → verified delivery</text>
  <text x="72" y="110" fill="#004c47" font-family="monospace" font-size="15">NEXT.JS 14 / REACT SERVER COMPONENTS / TYPESCRIPT</text>
  <g font-family="Arial,sans-serif">
    <rect x="70" y="175" width="280" height="220" fill="#111820"/>
    <text x="95" y="215" fill="#e5ba38" font-family="monospace" font-size="14">01 / SOURCE</text>
    <text x="95" y="262" fill="#fbfaf5" font-family="Georgia,serif" font-size="27">Typed evidence</text>
    <text x="95" y="299" fill="#aeb8bd" font-size="15">Projects, research metrics,</text>
    <text x="95" y="323" fill="#aeb8bd" font-size="15">limitations, navigation,</text>
    <text x="95" y="347" fill="#aeb8bd" font-size="15">social links, classifications</text>
    <rect x="455" y="175" width="290" height="220" fill="#fbfaf5" stroke="#111820" stroke-width="2"/>
    <text x="480" y="215" fill="#a9361d" font-family="monospace" font-size="14">02 / RENDER</text>
    <text x="480" y="262" fill="#111820" font-family="Georgia,serif" font-size="27">Static portfolio</text>
    <text x="480" y="299" fill="#354149" font-size="15">Six routes + six case studies</text>
    <text x="480" y="323" fill="#354149" font-size="15">Metadata, sitemap, robots, OG</text>
    <text x="480" y="347" fill="#354149" font-size="15">Local CSS, fonts, and SVG</text>
    <rect x="850" y="175" width="280" height="220" fill="#006d65"/>
    <text x="875" y="215" fill="#fff" font-family="monospace" font-size="14">03 / VERIFY</text>
    <text x="875" y="262" fill="#fff" font-family="Georgia,serif" font-size="27">Locked delivery</text>
    <text x="875" y="299" fill="#fff" font-size="15">Lint, types, content invariants</text>
    <text x="875" y="323" fill="#fff" font-size="15">Production build, axe, routes</text>
    <text x="875" y="347" fill="#fff" font-size="15">Desktop + mobile Playwright</text>
    <path d="M350 285H455M745 285H850" stroke="#f15a35" stroke-width="6"/>
    <path d="m443 273 12 12-12 12M838 273l12 12-12 12" fill="none" stroke="#f15a35" stroke-width="6"/>
    <rect x="70" y="475" width="1060" height="105" fill="#e4e0d4" stroke="#111820"/>
    <text x="95" y="515" fill="#004c47" font-family="monospace" font-size="14">PUBLICATION BOUNDARY</text>
    <text x="95" y="548" fill="#111820" font-size="16">No personal contact data · no analytics or cookies · no confidential research rows · no unsupported claims</text>
  </g>
</svg>
