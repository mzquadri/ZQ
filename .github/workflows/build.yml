name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The authorship guard reads commit metadata, so it needs the commits.
          fetch-depth: 0

      # Metadata only: author, committer and trailer identities. It deliberately does not
      # read file content, so documentation and dependency notices that name an AI vendor
      # are unaffected -- what fails is an assistant recorded as having authored the work.
      - name: Authorship
        run: bash tools/check-authorship.sh --all

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

      # The confidential draft is withheld by `draftsAreVisible`, which only excludes it
      # when VERCEL_ENV is "production" -- the environment Vercel builds in. `npm run check`
      # above builds without it, on purpose, so the draft is present and reviewable there.
      # That leaves the exclusion itself unexercised, so rebuild the way production does and
      # scan the output. tools/privacy-scan.mjs existed for exactly this and ran nowhere.
      - name: Privacy scan against a production build
        run: npm run build && npm run privacy:scan
        env:
          VERCEL_ENV: production

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
