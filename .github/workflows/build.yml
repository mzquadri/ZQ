name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Raised from 15 after a cancelled run. The browser cache and dropping one of three
    # builds are what bring the job back inside the limit; this is headroom on top of that,
    # not the fix, so a slow runner reports a result rather than being cancelled.
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The authorship guard reads commit metadata, so it needs the commits.
          fetch-depth: 0

      # Metadata and tracked artifacts, over the whole history. Deliberately does not read
      # file content, so documentation and dependency notices that name an AI vendor are
      # unaffected -- what fails is an assistant recorded as having authored the work.
      #
      # --skip-message-policy is what keeps this pass able to run over --all. One published
      # commit, 1ca31d9, carries a session trailer from before the policy existed. Scanning
      # every commit for it forever would fail every build on a commit nobody can fix
      # without rewriting published history, and a check that always fails gets deleted.
      # New commits are checked by range in the step below instead.
      - name: Authorship (identities and tracked artifacts, full history)
        run: bash tools/check-authorship.sh --all --skip-message-policy

      # The commit-message policy, over the commits this push or pull request actually adds.
      # This is the check that would have caught 1ca31d9 when it was made.
      #
      # The range is resolved defensively. A new branch reports an all-zero "before", a force
      # push can report a commit the runner does not have, and a pull request has to be
      # measured against its merge base rather than against the branch tip. In any case where
      # a range cannot be resolved, it falls back to the single head commit rather than to
      # nothing: a guard that silently checks zero commits is worse than no guard.
      - name: Commit messages (new commits only)
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
            range="${base}..${HEAD_SHA}"
          elif [ -n "${BEFORE:-}" ]             && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..${HEAD_SHA}"
          else
            echo "No resolvable predecessor; checking the head commit only."
            range="${HEAD_SHA}~1..${HEAD_SHA}"
            git cat-file -e "${HEAD_SHA}~1^{commit}" 2>/dev/null || range="$HEAD_SHA"
          fi
          echo "Checking commit messages in: ${range}"
          bash tools/check-authorship.sh "$range"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Two layers, and they answer different questions.
      #
      # check:security is offline and asserts that the installed version of a package meets the
      # minimum patch recorded for its release line. It cannot learn about a new advisory, but it
      # cannot be defeated by a stale lockfile, a revert, or a resolution that quietly moves
      # backwards either - which is how 16.3.1 would have returned.
      #
      # npm audit is the half that learns. It needs the network and it fails only on production
      # high and critical findings: a dev-only advisory should be visible in the log without
      # blocking a deployment that cannot be affected by it.
      - name: Dependency security floors
        run: npm run check:security

      - name: Dependency audit (production, high and above)
        run: npm audit --omit=dev --audit-level=high

      # Ends in `npm run build`, a non-production build, which is what the end-to-end suite
      # below then serves. Nothing between the two rebuilds it.
      - run: npm run check

      # Cache the browser binaries, keyed on the Playwright version that is actually
      # installed rather than on a lockfile hash, so the key moves exactly when the browser
      # it names does.
      #
      # Without this the job timed out. Downloading Chromium on every run, on top of three
      # separate production builds, took run 39987675614 past the 15 minute limit and it was
      # cancelled in the middle of the suite: a cancelled run reports neither pass nor fail,
      # which is the worst of the three outcomes.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browsers
        id: playwright-cache
        # v6, not v4. v4 targets the deprecated Node 20 and GitHub force-runs it on
        # Node 24 with an annotation on every run; the current majors differ per action,
        # so this one cannot be inferred from checkout@v7 or setup-node@v7.
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The browsers are cached; the apt packages they link against are not, because they
      # are installed into the runner image and the image is new every run. So a cache hit
      # still needs install-deps, which is apt only and downloads no browser.
      - name: Install the browser and its system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install the browser's system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # `playwright test` directly, not `npm run test:e2e`, which is `npm run build &&
      # playwright test`. The build it wants is the one `npm run check` already produced,
      # and the webServer in playwright.config.ts serves it with `npm start`. The npm script
      # keeps its build because it is the one a person runs locally from a cold tree.
      - run: npx playwright test

      # The confidential draft is withheld by `draftsAreVisible`, which only excludes it
      # when VERCEL_ENV is "production" -- the environment Vercel builds in. Every build
      # above is a non-production one, on purpose, so the draft is present and reviewable in
      # the suite. That leaves the exclusion itself unexercised, so rebuild the way
      # production does and scan the output. This step runs last because its build is the
      # one nothing else may inherit.
      - name: Privacy scan against a production build
        run: npm run build && npm run privacy:scan
        env:
          VERCEL_ENV: production
